
services:
  db:
    image: postgres:18
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: skillbox_db
    volumes:
      - pg_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    command: >
      postgres
      -c log_destination=stderr
      -c logging_collector=on
      -c log_directory=/var/log/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d skillbox_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  web:
    build: .
    container_name: flask_app
    restart: unless-stopped
    working_dir: /app
    command: gunicorn --bind 0.0.0.0:8000 "app:app"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network

volumes:
  pg_data:

networks:
  app_network:
    driver: bridge
